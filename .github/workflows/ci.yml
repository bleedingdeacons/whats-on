name: CI

# The suite's standard workflow (see lifelines/.github/workflows/ci.yml), with
# two additions for a plugin whose builder and front-end assets are compiled by
# npm: Node is set up wherever build.php runs (it runs `npm run build` before
# zipping), and the Vitest suite is a gate alongside Pest.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  # A merge is the release, so without this there is no way to cut one when the
  # merge's own run does not survive (the 2026-08-06 Actions outage left a run
  # queued with no runner, refusing cancel and rerun). A merge cannot be
  # repeated; this can.
  workflow_dispatch:

concurrency:
  # PR runs share one group per ref, so pushing again cancels the superseded
  # run. Runs on main get a group of their own (run_id is unique) and therefore
  # queue behind nothing: a run that never starts must not block every run after
  # it. Releases still serialise, on the release job's own group.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    # 8.4 is the suite's floor and 8.5 the current release, so both are gated.
    # Steps that write something shared (the build archive) are pinned to the
    # floor leg, or the two legs race each other over the same files.
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          # zip: build.php assembles the release archive with ZipArchive.
          extensions: mbstring, intl, json, zip
          tools: composer:v2
          # pcov drives Pest's line coverage for the Coveralls upload below.
          # Much faster than xdebug for coverage-only runs.
          coverage: pcov

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php }}-composer-

      # --- Gates -----------------------------------------------------------

      - name: Validate composer.json
        run: composer validate

      - name: Composer audit
        # --locked reads composer.lock directly, so this needs no vendor/.
        # --abandoned=report pins today's behaviour (Composer 3 defaults to fail).
        run: composer audit --locked --abandoned=report

      - name: npm audit
        # Production dependencies only: the plugin ships none, and the build
        # toolchain (esbuild, vitest) never reaches a site.
        run: npm audit --omit=dev --audit-level=high

      - name: Semgrep
        # Once only: Semgrep scans source, which does not vary by PHP version.
        # Diff-aware on a PR; a full scan on main, which gates the release.
        # Skips outright without SEMGREP_APP_TOKEN rather than scanning with a
        # quietly smaller ruleset and reporting green.
        if: matrix.php == '8.4'
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          if [ -z "${SEMGREP_APP_TOKEN:-}" ]; then
            echo 'SEMGREP_APP_TOKEN is not set - skipping the scan.'
            echo 'Set it as an organisation secret to enable this gate.'
            exit 0
          fi
          python3 -m pip install --quiet semgrep==1.174.0
          semgrep ci

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint PHP syntax
        run: |
          status=0
          while IFS= read -r -d '' file; do
            if ! out=$(php -l "$file" 2>&1); then
              echo "$out"
              status=1
            fi
          done < <(find . -path ./vendor -prune -o -path ./build -prune \
                        -o -path ./tests -prune -o -path ./node_modules -prune \
                        -o -name '*.php' -print0)
          exit $status

      - name: Vitest
        # The carousel behaviour and the builder's attribute parsing.
        if: matrix.php == '8.4'
        run: npm test

      - name: Build production archive
        # Once only: the result is identical on both legs. The release job
        # ships this exact command's output, so a broken build must fail the PR.
        if: matrix.php == '8.4'
        run: composer build:production

      - name: Committed assets match their source
        # assets/build is committed so a git checkout runs without a build.
        # The build above has just recompiled it, so any difference means the
        # committed bundles are stale.
        if: matrix.php == '8.4'
        run: |
          if ! git diff --quiet -- assets/build; then
            echo 'assets/build is out of date with assets/src. Run `npm run build` and commit the result.'
            git diff --stat -- assets/build
            exit 1
          fi

      - name: Pest
        # Over wp-mocks, the suite's shared WordPress test doubles.
        run: composer test -- --coverage-clover build/logs/clover.xml

      - name: PHPCS
        # A gate. .phpcs.xml.dist is PSR-12 with the suite's documented
        # exclusions (the ABSPATH guard reads as a PSR-1 side effect), plus the
        # snake_case method names Divi calls by name.
        run: composer phpcs

      - name: PHPCS badge is resolvable
        # Once only: the result is identical on both legs.
        if: matrix.php == '8.4'
        # The README badge reads the first top-level <rule ref> straight out of
        # .phpcs.xml.dist via /ruleset/rule[1]/@ref. Reorder the ruleset and the
        # badge silently advertises a different rule, so assert it here.
        run: |
          python3 - <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse('.phpcs.xml.dist').getroot()
          rules = root.findall('rule')
          ref = rules[0].get('ref') if rules else None
          if ref != 'PSR12':
              sys.exit('The first top-level <rule> in .phpcs.xml.dist is '
                       f'{ref!r}, not "PSR12" — the README badge would '
                       'advertise the wrong standard.')
          print('badge resolves:', ref)
          PY

      - name: PHPStan
        # A gate, at level 9 with no baseline. Divi 5 and The Events Calendar
        # are not installed here; tests/phpstan/stubs.php declares the parts of
        # them this plugin calls.
        run: composer phpstan

      - name: PHPStan badge is resolvable
        # Once only: the result is identical on both legs.
        if: matrix.php == '8.4'
        # The README badge reads parameters.level out of phpstan.neon.dist,
        # parsed as YAML. A NEON-only construct would quietly break it.
        run: |
          python3 - <<'PY'
          import sys, yaml
          cfg = yaml.safe_load(open('phpstan.neon.dist')) or {}
          level = cfg.get('parameters', {}).get('level')
          if not isinstance(level, int):
              sys.exit('phpstan.neon.dist no longer yields an integer '
                       'parameters.level when parsed as YAML — the README '
                       'badge would show "no result".')
          print('badge resolves: level', level)
          PY

      # --- Advisory --------------------------------------------------------
      # Reported but not enforced.

      - name: Upload coverage to Coveralls (advisory)
        # Once only: the result is identical on both legs.
        if: matrix.php == '8.4'
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        continue-on-error: true
        with:
          file: build/logs/clover.xml
          format: clover
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Release
  # ---------------------------------------------------------------------------
  # The merge is the release: gates pass, CI raises the version, builds the
  # archive from merged code and publishes it as a GitHub Release. /deploy
  # pulls the asset from there.
  release:
    name: Release
    needs: ci
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: the level comes from the commits since the
          # last release tag.
          fetch-depth: 0

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, json, zip
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Decide the next version
        id: version
        # feat! or BREAKING CHANGE -> major, feat: -> minor, anything else ->
        # patch, over the commits since the last v* tag. Three states:
        #   1. the header carries a version never tagged (a run died after its
        #      version commit) -> publish that version rather than invent one;
        #   2. nothing since the last tag -> skip, successfully;
        #   3. otherwise raise the version. The first release is always a patch.
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re, subprocess, sys

          MAIN = 'whats-on.php'

          def git(*args):
              return subprocess.run(['git', *args], capture_output=True,
                                    text=True, check=True).stdout

          tags = git('tag', '--list', 'v[0-9]*', '--sort=-v:refname').split()
          last = tags[0] if tags else ''

          with open(MAIN, encoding='utf-8', newline='') as fh:
              src = fh.read()
          m = re.search(r'(?m)^(?P<pre>\s*\*\s*Version:\s*)'
                        r'(?P<ver>[0-9]+(?:\.[0-9]+)*)(?P<post>.*)$', src)
          if not m:
              sys.exit(f'No "Version:" header line in {MAIN}.')
          header = m.group('ver')

          if f'v{header}' not in set(tags):
              print('action=publish', f'version={header}', f'previous={header}',
                    'level=none',
                    'why=version already committed but never released; publishing it',
                    sep='\n')
              sys.exit(0)

          if last and not [s for s in git('log', f'{last}..HEAD', '--format=%s').splitlines() if s]:
              print('action=skip', f'version={header}', f'previous={header}',
                    'level=none', f'why=no commits since {last}', sep='\n')
              sys.exit(0)

          if not last:
              level, why = 'patch', 'no previous release tag; first release is always a patch'
          else:
              rng = f'{last}..HEAD'
              subjects = [s for s in git('log', rng, '--format=%s').splitlines() if s]
              bodies = git('log', rng, '--format=%B')
              breaking = [s for s in subjects if re.match(r'^[a-z]+(\([^)]*\))?!:', s)]
              feats = [s for s in subjects if re.match(r'^feat(\([^)]*\))?:', s)]
              if breaking:
                  level, why = 'major', f'breaking change: {breaking[0]}'
              elif re.search(r'BREAKING[ -]CHANGE', bodies):
                  level, why = 'major', 'BREAKING CHANGE in a commit body'
              elif feats:
                  level, why = 'minor', f'feat: commit: {feats[0]}'
              else:
                  level, why = 'patch', (f'{len(subjects)} commit(s) since {last}, '
                                         'none feat: or breaking')

          parts = [int(p) for p in header.split('.')]
          if level in ('major', 'minor'):
              while len(parts) < 3:
                  parts.append(0)
              idx = 0 if level == 'major' else 1
              parts[idx] += 1
              for i in range(idx + 1, len(parts)):
                  parts[i] = 0
          else:
              parts[-1] += 1
          new = '.'.join(str(p) for p in parts)

          src = src[:m.start()] + m.group('pre') + new + m.group('post') + src[m.end():]
          with open(MAIN, 'w', encoding='utf-8', newline='') as fh:
              fh.write(src)

          print('action=bump', f'level={level}', f'version={new}',
                f'previous={header}', f'why={why}', sep='\n')
          PY

      - name: Install dependencies
        if: steps.version.outputs.action != 'skip'
        run: |
          composer install --no-dev --prefer-dist --no-progress
          npm ci --no-audit --no-fund

      - name: Build production archive
        if: steps.version.outputs.action != 'skip'
        # The shipping zip. build.php also propagates the version raised above
        # into readme.txt and README.md, which the commit below picks up.
        run: composer build:production

      - name: Check the archive was produced
        if: steps.version.outputs.action != 'skip'
        run: |
          zip="build/whats-on-production-${{ steps.version.outputs.version }}.zip"
          if [ ! -f "$zip" ]; then
            echo "Expected $zip, but build/ holds:"
            ls -l build || true
            exit 1
          fi
          echo "archive: $zip ($(stat -c%s "$zip") bytes)"

      - name: Commit the version bump
        id: commit
        if: steps.version.outputs.action != 'skip'
        # Straight to main, with [skip ci]. Push first and rebase only when
        # rejected, so a merge landing mid-build cannot lose the release.
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if git diff --cached --quiet; then
            echo 'Nothing to commit - the version header is already current.'
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'chore(release): v${{ steps.version.outputs.version }} [skip ci]'

          pushed=
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Pushed the release commit on attempt $attempt."
              pushed=yes
              break
            fi
            echo "Push rejected on attempt $attempt; main moved. Rebasing onto it."
            if ! git pull --rebase origin main; then
              echo 'Rebase onto main failed; leaving it alone.' >&2
              git rebase --abort || true
              exit 1
            fi
          done
          if [ -z "$pushed" ]; then
            echo 'Could not push the release commit after 3 attempts.' >&2
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub Release
        if: steps.version.outputs.action != 'skip'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already published; nothing to do."
            exit 0
          fi
          gh release create "v$VERSION" \
            "build/whats-on-production-$VERSION.zip" \
            --title "v$VERSION" \
            --target "${{ steps.commit.outputs.sha }}" \
            --generate-notes

      - name: Summary
        # Everything reaches the shell as an environment variable: WHY carries a
        # commit subject, which must never be substituted into a script.
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          LEVEL: ${{ steps.version.outputs.level }}
          WHY: ${{ steps.version.outputs.why }}
        run: |
          {
            printf '### Released `v%s`\n\n' "$VERSION"
            printf '| | |\n|---|---|\n'
            printf '| previous | `%s` |\n' "$PREVIOUS"
            printf '| level | `%s` |\n' "$LEVEL"
            printf '| because | %s |\n' "$WHY"
            printf '| asset | `whats-on-production-%s.zip` |\n\n' "$VERSION"
            printf 'Install it with `/deploy test whats-on`.\n'
          } >> "$GITHUB_STEP_SUMMARY"
